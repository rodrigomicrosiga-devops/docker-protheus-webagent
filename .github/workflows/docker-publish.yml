name: Docker Build & Push WebAgent to Docker Hub

on:
  push:
    branches:
      - main
      - develop
    paths-ignore:
      - 'README.md'
      - '.gitignore'

jobs:
  build-and-push:
    name: Build and Push WebAgent Image on Local Infrastructure
    runs-on: self-hosted

    steps:
      - name: Checkout do Código
        uses: actions/checkout@v4

      # 🚀 Resgata o pacote de forma dinâmica e tolera variações de caixa alta/baixa no nome
      - name: Resgatar WebAgent Proprietário no Workspace
        run: |
          echo "🔍 Procurando arquivos do WebAgent nos caminhos conhecidos..."

          shopt -s nullglob

          CANDIDATOS=(
            ../../*[wW][eE][bB]-[aA][gG][eE][nN][tT]*.[tT][aA][rR].[gG][zZ]
            "${{ github.workspace }}/../"*[wW][eE][bB]-[aA][gG][eE][nN][tT]*.[tT][aA][rR].[gG][zZ]
            /media/rodrigo/dados/docker-protheus-webagent/*[wW][eE][bB]-[aA][gG][eE][nN][tT]*.[tT][aA][rR].[gG][zZ]
          )

          COPIADO=false
          for ARQUIVO in "${CANDIDATOS[@]}"; do
            if [ -f "$ARQUIVO" ]; then
              echo "✅ Arquivo encontrado em: $ARQUIVO"
              cp "$ARQUIVO" .
              COPIADO=true
              break
            fi
          done

          if [ "$COPIADO" = false ]; then
            echo "❌ ERRO: O arquivo compactado do WebAgent não foi localizado em nenhum dos diretórios mapeados!"
            echo "Certifique-se de que o arquivo (.TAR.GZ) está em /media/rodrigo/dados/docker-protheus-webagent/ ou no nível acima do projeto."
            exit 1
          fi

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: rodrigomicrosiga/webagent-dev:1.1.1
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
