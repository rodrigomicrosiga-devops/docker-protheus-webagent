name: Docker Build & Push WebAgent to Docker Hub

on:
  push:
    branches:
      - main
      - develop
    paths-ignore:
      - 'README.md'
      - '.gitignore'

jobs:
  build-and-push:
    name: Build and Push WebAgent Image on Local Infrastructure
    runs-on: self-hosted

    steps:
      - name: Checkout do Código
        uses: actions/checkout@v4

      # 🚀 Resgata TODOS os pacotes presentes (Linux .tar.gz, Windows .zip,
      # macOS .dmg) de forma dinâmica, tolerando variação de caixa no nome e
      # qualquer subconjunto de SOs disponível -- só a build Linux é
      # obrigatória, as outras entram se existirem.
      - name: Resgatar WebAgent Proprietário no Workspace
        run: |
          echo "🔍 Procurando arquivos do WebAgent nos caminhos conhecidos..."

          shopt -s nullglob

          DIRETORIOS=(
            ../..
            "${{ github.workspace }}/.."
            /media/rodrigo/dados/docker-protheus-webagent
          )

          COPIADO=false
          for DIR in "${DIRETORIOS[@]}"; do
            ARQUIVOS=(
              "$DIR"/*[wW][eE][bB]-[aA][gG][eE][nN][tT]*.[tT][aA][rR].[gG][zZ]
              "$DIR"/*[wW][eE][bB]-[aA][gG][eE][nN][tT]*.[zZ][iI][pP]
              "$DIR"/*[wW][eE][bB]-[aA][gG][eE][nN][tT]*.[dD][mM][gG]
            )
            if [ ${#ARQUIVOS[@]} -gt 0 ]; then
              echo "✅ Encontrados ${#ARQUIVOS[@]} arquivo(s) em: $DIR"
              for ARQUIVO in "${ARQUIVOS[@]}"; do
                echo "   - $(basename "$ARQUIVO")"
                cp "$ARQUIVO" .
              done
              COPIADO=true
              break
            fi
          done

          if [ "$COPIADO" = false ]; then
            echo "❌ ERRO: Nenhum arquivo do WebAgent foi localizado em nenhum dos diretórios mapeados!"
            echo "Certifique-se de que pelo menos um pacote (.TAR.GZ/.ZIP/.DMG) está em /media/rodrigo/dados/docker-protheus-webagent/ ou no nível acima do projeto."
            exit 1
          fi

          if ! ls ./*[wW][eE][bB]-[aA][gG][eE][nN][tT]*.[tT][aA][rR].[gG][zZ] >/dev/null 2>&1; then
            echo "⚠️  Aviso: nenhum .TAR.GZ (Linux) encontrado -- a build mínima esperada não está presente."
          fi

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: rodrigomicrosiga/webagent-dev:1.1.1
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
